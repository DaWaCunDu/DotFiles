# foolishlee.com -> Next.js blog on 127.0.0.1:3002
# Source lives at /mnt/MacStore/www/foolishlee.com
# Both apex and www proxy to the same app; the bare host is redirected to www.
server {
    listen       80;
    server_name  foolishlee.com;

    return 301 https://www.foolishlee.com$request_uri;
}

server {
    listen       80;
    server_name  www.foolishlee.com;

    access_log /var/log/angie/foolishlee.com.access.log main;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
