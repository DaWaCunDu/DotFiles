# highsobriety.online -> static Hugo site (dragon-lab theme)
# Content lives at /mnt/MacStore/www/hugo/sites/highsobriety.online
server {
    listen       80;
    server_name  highsobriety.online;

    root  /usr/share/angie/html/highsobriety.online;
    index index.html;

    access_log /var/log/angie/highsobriety.online.access.log main;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/angie/html/highsobriety.online;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/angie/html;
    }
}