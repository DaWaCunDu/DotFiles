# ── General ──────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on

# ── Vim Keybindings ──────────────────────────────────────────────────
setw -g mode-keys vi

# Copy mode vim bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Status Bar ───────────────────────────────────────────────────────
set -g status-position top
set -g status-interval 5

# Colors: dark bg with bright text
set -g status-style "bg=colour232,fg=colour250"

# Left: hostname + session name + window list
set -g status-left-length 50
set -g status-left "#[fg=colour40,bold] foolishleesmini #[fg=colour24]│ #[fg=colour39,bold] #S #[fg=colour24]│ "
set -g status-right-length 40
set -g status-right "#(~/.DotFiles/scripts/tmux-date.sh) #[fg=colour248]│ #[fg=colour196,bold]%H:%M "

# Windows (tabs) displayed to the left of center
setw -g window-status-format "#[fg=colour243] #I:#W "
setw -g window-status-current-format "#[fg=colour118,bold] #I:#W "

# Pane borders
set -g pane-border-style "bg=default,fg=colour238"
set -g pane-active-border-style "bg=default,fg=colour118"

# Message style
set -g message-style "bg=default,fg=colour118"

# Mode (copy) highlight
setw -g mode-style "bg=colour24,fg=colour75"